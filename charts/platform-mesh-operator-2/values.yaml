crds:
  enabled: true

deployment:
  replicas: 1

log:
  level: debug

operator:
  leaderElect: true

image:
  name: localhost:5001/pm-operator

imagePullPolicy: Always

hostAliases:
  enabled: true # TODO: should default to false

tracing:
  enabled: false
  collector:
    endpoint: observability-opentelemetry-collector.observability.svc.cluster.local:4317

extraArgs:
  - --subroutines-feature-toggles-enabled=true

idp:
  registrationAllowed: false

istio:
  enabled: false

remoteInfra:
  # -- Enables reconciliation of PlatformMesh resources on remote clusters
  enabled: false
  # -- Name of the secret containing the kubeconfig for remote cluster access where the PlatformMesh resources will be deployed
  secretName: "platform-mesh-kubeconfig"
  secretKey: "kubeconfig"

remoteRuntime:
  # -- Enables deployment to remote clusters. Set to true if the operator is not deployed on the same cluster where the Infra artefacts will be created.
  enabled: false
  # -- Name of the secret containing the kubeconfig for the cluster where the created Infra artefacts will be created. NOTE: target deployment will alway be same as the cluster where the Platform Mesh resource lives.
  secretName: "platform-mesh-secret"
  secretKey: "kubeconfig"
  infra:
    # -- Name of the secret containing Runtime cluster kubeconfig
    secretName: "platform-mesh-secret"
    secretKey: "kubeconfig"

providers:
  # -- Enables the providers controller deployment
  enabled: true # TODO: should default to false
  replicas: 1
  # kcp:
  #   # -- Full KCP URL (overrides front-proxy-based URL construction when set)
  #   url: ""
  #   # -- Namespace where the KCP front-proxy service lives
  #   namespace: "platform-mesh-system"
  #   # -- Name of the KCP front-proxy service (without namespace suffix)
  #   frontProxyName: "frontproxy"
  #   # -- Port of the KCP front-proxy service
  #   frontProxyPort: "6443"
  #   # -- Name of the Secret containing the KCP cluster-admin client certificate
  #   clusterAdminSecretName: "kcp-cluster-admin-client-cert"
  # # -- Name of the APIExportEndpointSlice to watch for provider virtual workspace URLs
  # apiExportEndpointSliceName: "providers.platform-mesh.io"
  # # -- KCP workspace path containing the APIExportEndpointSlice
  # apiExportEndpointSliceWorkspace: "root:providers"
